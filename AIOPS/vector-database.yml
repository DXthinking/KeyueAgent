services:
  mysql:
    container_name: ecommerce-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_cs
    ports:
      - "3306:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - ./volumes/mysql:/var/lib/mysql
    networks: [ecommerce-cs]

  redis:
    container_name: ecommerce-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./volumes/redis:/data
    networks: [ecommerce-cs]

  rocketmq-namesrv:
    container_name: ecommerce-rocketmq-namesrv
    image: apache/rocketmq:5.3.1
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ./volumes/rocketmq/namesrv/logs:/home/rocketmq/logs
    networks: [ecommerce-cs]

  rocketmq-broker:
    container_name: ecommerce-rocketmq-broker
    image: apache/rocketmq:5.3.1
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    ports:
      - "10909:10909"
      - "10911:10911"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - ./volumes/rocketmq/broker/logs:/home/rocketmq/logs
      - ./volumes/rocketmq/broker/store:/home/rocketmq/store
    depends_on: [rocketmq-namesrv]
    networks: [ecommerce-cs]

  rocketmq-dashboard:
    container_name: ecommerce-rocketmq-dashboard
    image: apacherocketmq/rocketmq-dashboard:2.0.1
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rocketmq-namesrv:9876
    ports:
      - "8180:8080"
    depends_on: [rocketmq-namesrv]
    networks: [ecommerce-cs]

  elasticsearch:
    container_name: ecommerce-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./volumes/elasticsearch:/usr/share/elasticsearch/data
    networks: [ecommerce-cs]

  sentinel-dashboard:
    container_name: ecommerce-sentinel-dashboard
    image: bladex/sentinel-dashboard:1.8.8
    ports:
      - "8858:8858"
    networks: [ecommerce-cs]

  skywalking-oap:
    container_name: ecommerce-skywalking-oap
    image: apache/skywalking-oap-server:9.7.0
    ports:
      - "11800:11800"
      - "12800:12800"
    networks: [ecommerce-cs]

  skywalking-ui:
    container_name: ecommerce-skywalking-ui
    image: apache/skywalking-ui:9.7.0
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8088:8080"
    depends_on: [skywalking-oap]
    networks: [ecommerce-cs]

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    networks: [ecommerce-cs]
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    networks: [ecommerce-cs]
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks: [ecommerce-cs]
  # 这是新增的 Attu 服务哦！
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.5
    ports:
      - "8000:3000" # 把本地的 8000 端口映射到容器的 3000 端口 (Attu 默认端口)
    environment:
      # MILVUS_URL 指向 Docker 网络里的 Milvus standalone 服务
      MILVUS_URL: standalone:19530
    depends_on:
      - standalone # 确保 Milvus 启动后再启动 Attu
    networks: [ecommerce-cs]
networks:
  default:
    name: ecommerce-cs
  ecommerce-cs:
    name: ecommerce-cs
